<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locky - Nueva Contraseña</title>
  
  <!-- 1. SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Carga de variables de entorno -->
  <script src="./env.js"></script>
</head>
<body style="margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; box-sizing: border-box;">
  
  <div style="max-width: 440px; width: 100%; background: linear-gradient(180deg, #111e38 0%, #0d172c 100%); border-radius: 20px; border: 1px solid #1e3a5f; padding: 40px 24px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);">
    
    <!-- Icono Llave / Seguridad -->
    <div style="margin-bottom: 20px;">
      <div style="display: inline-block; background-color: #172847; padding: 16px; border-radius: 50%; border: 1px solid #00c2ff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-1.5 1.5L14 9a5 5 0 1 0-5 5l2-2"></path>
          <circle cx="7.5" cy="16.5" r="3.5"></circle>
          <path d="m15.5 8.5 2 2"></path>
          <path d="m13.5 10.5 2 2"></path>
        </svg>
      </div>
    </div>

    <h1 style="font-size: 22px; font-weight: 700; color: #ffffff; margin: 0 0 8px 0; letter-spacing: -0.5px;">
      Crea una nueva contraseña
    </h1>
    <p style="font-size: 14px; line-height: 1.5; color: #94a3b8; margin: 0 0 24px 0;">
      Ingresa tu nueva clave de acceso para tu cuenta de <strong style="color: #ffffff;">Locky</strong>.
    </p>

    <!-- Formulario de cambio -->
    <form id="reset-form" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
      <div>
        <label style="display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px;">
          Nueva contraseña
        </label>
        <input 
          type="password" 
          id="new-password" 
          placeholder="Mínimo 6 caracteres" 
          required 
          minlength="6"
          style="width: 100%; box-sizing: border-box; background-color: #0b1329; border: 1px solid #1e3a5f; border-radius: 10px; padding: 12px 14px; color: #ffffff; font-size: 14px; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='#00c2ff'" 
          onblur="this.style.borderColor='#1e3a5f'"
        />
      </div>

      <div>
        <label style="display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px;">
          Confirmar contraseña
        </label>
        <input 
          type="password" 
          id="confirm-password" 
          placeholder="Repite la contraseña" 
          required 
          minlength="6"
          style="width: 100%; box-sizing: border-box; background-color: #0b1329; border: 1px solid #1e3a5f; border-radius: 10px; padding: 12px 14px; color: #ffffff; font-size: 14px; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='#00c2ff'" 
          onblur="this.style.borderColor='#1e3a5f'"
        />
      </div>

      <button 
        type="submit" 
        id="submit-btn"
        style="margin-top: 8px; width: 100%; background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%); color: #ffffff; border: none; font-size: 15px; font-weight: 600; padding: 13px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 210, 255, 0.35); transition: opacity 0.2s;">
        Actualizar contraseña
      </button>
    </form>

    <div id="status-message" style="display: none; margin-top: 18px; font-size: 13px; padding: 12px; border-radius: 10px; line-height: 1.4;"></div>

    <div id="success-view" style="display: none;">
      <div style="background-color: rgba(0, 210, 255, 0.08); border: 1px dashed #00c2ff; border-radius: 12px; padding: 16px; font-size: 14px; color: #38bdf8; line-height: 1.5; margin-top: 10px;">
        ✓ ¡Contraseña actualizada exitosamente! Ya puedes cerrar esta pestaña y entrar a Locky con tu nueva clave.
      </div>
    </div>

  </div>

  <script>
    // Se obtienen las variables desde el archivo env.js
    const SUPABASE_URL = window.ENV?.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.ENV?.SUPABASE_ANON_KEY;

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      console.error("Faltan las credenciales en env.js");
    }

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-message');
    const successView = document.getElementById('success-view');

    function showStatus(text, isError = false) {
      statusMsg.style.display = 'block';
      statusMsg.textContent = text;
      statusMsg.style.backgroundColor = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)';
      statusMsg.style.border = isError ? '1px solid #ef4444' : '1px solid #10b981';
      statusMsg.style.color = isError ? '#f87171' : '#34d399';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        showStatus('Las contraseñas no coinciden.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Actualizando...';
      submitBtn.style.opacity = '0.7';

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: newPassword
        });

        if (error) {
          showStatus(error.message, true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Actualizar contraseña';
          submitBtn.style.opacity = '1';
        } else {
          form.style.display = 'none';
          statusMsg.style.display = 'none';
          successView.style.display = 'block';
        }
      } catch (err) {
        showStatus('Ocurrió un error inesperado. Inténtalo de nuevo.', true);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Actualizar contraseña';
        submitBtn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
