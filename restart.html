<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locky - Contraseña Actualizada</title>
</head>
<body style="margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; box-sizing: border-box;">
  
  <div style="max-width: 440px; width: 100%; background: linear-gradient(180deg, #111e38 0%, #0d172c 100%); border-radius: 20px; border: 1px solid #1e3a5f; padding: 40px 24px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);">
    
    <!-- Icono Escudo / Seguridad Actualizada -->
    <div style="margin-bottom: 24px;">
      <div style="display: inline-block; background-color: #172847; padding: 18px; border-radius: 50%; border: 1px solid #00c2ff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
      </div>
    </div>

    <!-- Título -->
    <h1 style="font-size: 22px; font-weight: 700; color: #ffffff; margin: 0 0 12px 0; letter-spacing: -0.5px;">
      Contraseña actualizada
    </h1>

    <!-- Mensaje Principal -->
    <p style="font-size: 15px; line-height: 1.6; color: #94a3b8; margin: 0 0 24px 0;">
      Tu clave de acceso ha sido restablecida correctamente. Ya puedes cerrar esta ventana y volver a <strong style="color: #ffffff;">Locky</strong> para iniciar sesión.
    </p>

    <!-- Indicador informativo -->
    <div style="background-color: rgba(0, 210, 255, 0.06); border: 1px dashed #1e3a5f; border-radius: 12px; padding: 12px; font-size: 13px; color: #64748b;">
      Tus datos y contraseñas permanecen seguros.
    </div>

  </div>

</body>
</html>
